name: Deploy Nivenar Build Artifact
on:
  push:
    paths:
      - '.github/workflows/deploy-nivenar-artifact.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4
      - name: Download production build
        run: |
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-38cc-820e-a18d-0c469c98a57d/raw?se=2026-09-11T12%3A28%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=962a57b4-c302-501e-b0c1-c4ffe291a18a&skoid=db6dad9e-03ee-465b-aef6-ce0f63a161dc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-11T11%3A07%3A53Z&ske=2026-09-12T11%3A07%3A53Z&sks=b&skv=2026-02-06&sig=IpbBnuDfvJfkld1GxVK69JNqJYja1up8hUWjDkSTauU%3D' -o /tmp/nivenar-ghpages.zip
          rm -rf /tmp/nivenar-site
          mkdir -p /tmp/nivenar-site
          unzip -q /tmp/nivenar-ghpages.zip -d /tmp/nivenar-site
      - name: Replace published site
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a /tmp/nivenar-site/. .
          test -f index.html
          test -f CNAME
          grep -q 'nivenar.com' CNAME
          grep -q '/assets/index-' index.html
          if grep -R '/mestre-demo/' . --exclude-dir=.git --exclude-dir=.github; then
            echo 'Found obsolete /mestre-demo/ reference'
            exit 1
          fi
      - name: Commit production build
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'deploy: validação automática de CPF e CRFa'
          git push origin main
