name: Deploy Nivenar Build Artifact
on:
  push:
    paths:
      - '.github/workflows/deploy-nivenar-artifact.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4
      - name: Download production build
        run: |
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-7178-820e-a32f-604ec94d5aff/raw?se=2026-09-11T00%3A21%3A07Z&sp=r&sv=2026-02-06&sr=b&scid=4e8733f1-f382-55a2-95f9-8e45ec454bc4&skoid=db6dad9e-03ee-465b-aef6-ce0f63a161dc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-10T09%3A20%3A22Z&ske=2026-09-11T09%3A20%3A22Z&sks=b&skv=2026-02-06&sig=8Idd%2B5uYv5qzBPBa8ssigvq8QNu9R6dGZ3ydJwHYtJg%3D' -o /tmp/nivenar-ghpages.zip
          rm -rf /tmp/nivenar-site
          mkdir -p /tmp/nivenar-site
          unzip -q /tmp/nivenar-ghpages.zip -d /tmp/nivenar-site
      - name: Replace published site
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a /tmp/nivenar-site/. .
          test -f index.html
          test -f CNAME
          grep -q 'nivenar.com' CNAME
          grep -q '/assets/index-' index.html
          if grep -R '/mestre-demo/' . --exclude-dir=.git --exclude-dir=.github; then
            echo 'Found obsolete /mestre-demo/ reference'
            exit 1
          fi
      - name: Commit production build
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'deploy: confirmação de cadastro pelo noreply NIVENAR'
          git push origin main
