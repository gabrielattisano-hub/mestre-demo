<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>MESTRE</title>
    <!--
      GitHub Pages não tem servidor para redirecionar rotas do React Router — qualquer
      caminho que não seja um arquivo real (ex: /mestre-demo/comecar) cai aqui. Este script
      guarda o caminho pedido numa query string e redireciona pra home, que devolve pro
      caminho original assim que o React carrega (ver script no <head> do index.html).
      Padrão: https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1 // mantém "/mestre-demo" como prefixo
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
