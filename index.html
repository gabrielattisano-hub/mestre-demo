<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- GitHub Pages não deixa configurar headers HTTP — estas tags reduzem o cache do
         navegador para este HTML (os assets com hash no nome continuam com cache forte). -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NIVENAR — A evolução continua. Profissionais, pacientes, atividades e evolução conectados em um só lugar, com NIV e NIVA como assistentes inteligentes." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Manrope:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <title>NIVENAR — A evolução continua.</title>
    <!-- Desfaz o redirecionamento feito pelo 404.html (ver esse arquivo), restaurando a
         URL original antes do React Router assumir. Precisa rodar antes do bundle da app. -->
    <script type="text/javascript">
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <script type="module" crossorigin src="/assets/index-Bot__vnd.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-mGRR7ohB.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
